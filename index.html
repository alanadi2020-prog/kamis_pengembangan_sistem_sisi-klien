<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>justify-content &amp; align-items</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 20px;
      background: #f4f2fd;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1f1f29;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.8rem;
    }

    h2 {
      margin: 28px 0 16px;
      font-size: 1.4rem;
    }

    /* ===== Bagian 1: justify-content & align-items ===== */
    .wadah {
      display: flex;
      gap: 10px;
      height: 230px;
      padding: 10px;
      background: #ffffff;
      border: 1.5px dotted #5b3ab5;
      border-radius: 8px;
      justify-content: space-between;

      /* COBA UBAH-UBAH, lalu simpan dan lihat hasilnya:
         justify-content: flex-start | center | flex-end | space-between | space-around
         align-items: stretch | flex-start | center | flex-end
      */
    }

    .item {
      width: 44px;
      padding-top: 8px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      border-radius: 8px;
    }

    .satu { background: #5b3ab5; }
    .dua  { background: #c43c78; padding-top: 16px; }
    .tiga { background: #5ea66b; padding-top: 12px; }

    /* ===== Bagian 2: trik menengahkan sempurna ===== */
    .tengah {
      height: 220px;
      background: #ffffff;
      border: 1.5px dotted #5ea66b;
      border-radius: 8px;

      /* TRIK: hapus tanda komentar tiga baris di bawah ini
         display: flex;
         justify-content: center;
         align-items: center;
      */
    }

    .kotak {
      display: inline-block;
      padding: 14px 22px;
      font-weight: 700;
      color: #ffffff;
      background: #5ea66b;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>justify-content &amp; align-items</h1>

  <div class="wadah">
    <div class="item satu">1</div>
    <div class="item dua">2</div>
    <div class="item tiga">3</div>
  </div>

  <h2>Trik menengahkan sempurna</h2>

  <div class="tengah">
    <div class="kotak">Saya di tengah</div>
  </div>
</body>
</html>
